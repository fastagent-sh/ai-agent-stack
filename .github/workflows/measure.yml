name: measure
on:
  schedule:
    - cron: "0 6 * * *" # daily; velocity needs snapshots a day apart
  workflow_dispatch:
permissions:
  contents: write
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs: the organisation requires it, and a moving tag is a supply-chain hole.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.MEASURE_TOKEN || github.token }}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"
      # Measurement needs no model, so it runs here. Discovery and judgement run in the agent.
      - run: node scripts/refresh.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the day's measurement
        run: |
          git config user.name "measure-bot"
          git config user.email "actions@github.com"
          git add data README.md CHANGES.md layers seeds.json
          git diff --staged --quiet || git commit -m "measure: $(date -u +%Y-%m-%d)"
          git push
